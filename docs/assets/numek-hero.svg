<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">NUMEK — Evidence for every AI decision.</title>
  <desc id="desc">An ivory editorial cover with the Numek wordmark, a large headline, and three blue, teal and violet evidence paths converging on a coral point.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#0F1B22" stroke-opacity=".055"/></pattern>
    <linearGradient id="fade" x1="825" y1="100" x2="1200" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#D5E4EB"/><stop offset="1" stop-color="#F3F1EC"/></linearGradient>
  </defs>
  <rect width="1280" height="560" rx="12" fill="#F3F1EC"/>
  <path d="M48 84H1232M48 486H1232" stroke="#0F1B22" stroke-opacity=".18"/>
  <g stroke="#0F1B22" stroke-opacity=".4"><path d="M48 37V53M40 45H56M1232 37V53M1224 45H1240M48 507V523M40 515H56M1232 507V523M1224 515H1240"/></g>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#0F1B22">
    <circle cx="83" cy="45" r="10" stroke="#0F1B22" stroke-width="2"/><circle cx="83" cy="45" r="4" fill="#E5553B"/>
    <text x="105" y="55" font-size="29" font-weight="700" letter-spacing="-1">NUMEK</text>
    <text x="1200" y="51" text-anchor="end" font-family="'Courier New', monospace" font-size="14" letter-spacing="2">AI RELIABILITY VERIFICATION</text>
    <text x="70" y="146" font-family="'Courier New', monospace" font-size="14" letter-spacing="2" fill="#55636B">DATA. PREDICTIONS. EVIDENCE.</text>
    <text x="65" y="252" font-size="88" font-weight="600" letter-spacing="-4">Evidence for</text>
    <text x="65" y="346" font-size="88" font-weight="600" letter-spacing="-4">every AI decision<tspan fill="#E5553B">.</tspan></text>
    <text x="70" y="411" font-size="23" fill="#55636B">Understand the data. Examine the predictions.</text>
    <text x="70" y="445" font-size="23" fill="#55636B">Make the evidence part of the decision.</text>
    <text x="70" y="520" font-family="'Courier New', monospace" font-size="14" letter-spacing="1" fill="#55636B">BUILT FOR TEAMS THAT NEED TO KNOW WHY.</text>
  </g>
  <g>
