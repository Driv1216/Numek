<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Three moments. One standard of evidence.</title>
  <desc id="desc">A conceptual product map: DataTrust inspects data before training, ConfidenceGuard examines model predictions, and HallucinationGuard is a research direction for generated answers. The drawings illustrate concepts, not measured results or application screenshots.</desc>
  <rect width="1280" height="420" rx="12" fill="#F3F1EC"/>
  <rect x="20" y="20" width="402" height="380" rx="8" fill="#D5E4EB"/>
  <rect x="439" y="20" width="402" height="380" rx="8" fill="#D6EAE6"/>
  <rect x="858" y="20" width="402" height="380" rx="8" fill="#E6E5EF"/>
  <g font-family="'Courier New', monospace" font-size="14" letter-spacing="1.4">
    <text x="46" y="56" fill="#163F52">01 / BEFORE TRAINING</text>
    <text x="465" y="56" fill="#1F4D47">02 / MODEL PREDICTIONS</text>
    <text x="884" y="56" fill="#2E3160">03 / AFTER GENERATION</text>
  </g>
  <!-- A dataset with a visible exception. -->
  <g transform="translate(76 89)">
    <rect width="280" height="160" rx="5" fill="#FBFAF7" stroke="#2C6E8E" stroke-opacity=".2"/>
    <path d="M0 32H280M0 64H280M0 96H280M0 128H280M56 0V160M112 0V160M168 0V160M224 0V160" stroke="#2C6E8E" stroke-opacity=".2"/>
    <g fill="#2C6E8E"><rect x="14" y="12" width="28" height="8" rx="2"/><rect x="70" y="12" width="28" height="8" rx="2"/><rect x="126" y="12" width="28" height="8" rx="2"/><rect x="182" y="12" width="28" height="8" rx="2"/><rect x="238" y="12" width="28" height="8" rx="2"/></g>
    <g stroke="#2C6E8E" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"><path d="M19 48H37M75 48H93M131 48H149M187 48H205M243 48H261M19 80H37M75 80H93M131 80H149M243 80H261M19 112H37M75 112H93M131 112H149M187 112H205M243 112H261M19 144H37M75 144H93M131 144H149M187 144H205M243 144H261"/></g>
    <rect x="169" y="65" width="54" height="30" fill="#FBE7E2"/><circle cx="196" cy="80" r="5" fill="#E5553B"/>
    <path d="M196 87V177H272" stroke="#E5553B" stroke-width="1.5"/><circle cx="278" cy="177" r="4" fill="#E5553B"/>
  </g>
  <!-- A magnifying lens over predictions: examination, not a performance claim. -->
  <g transform="translate(495 89)">
    <rect width="280" height="160" rx="5" fill="#FBFAF7" stroke="#3F8F86" stroke-opacity=".2"/>
    <g stroke="#3F8F86" stroke-opacity=".22"><path d="M20 40H260M20 80H260M20 120H260"/></g>
    <g fill="#3F8F86"><circle cx="37" cy="40" r="5"/><circle cx="37" cy="80" r="5"/><circle cx="37" cy="120" r="5"/></g>
    <g fill="#3F8F86" fill-opacity=".3"><rect x="55" y="35" width="72" height="10" rx="2"/><rect x="55" y="75" width="104" height="10" rx="2"/><rect x="55" y="115" width="55" height="10" rx="2"/></g>
    <circle cx="204" cy="72" r="45" fill="#D6EAE6" stroke="#1F4D47" stroke-width="2"/>
    <path d="M236 105L268 137" stroke="#1F4D47" stroke-width="8" stroke-linecap="round"/>
    <path d="M180 78H191L200 59L210 87L219 70H231" stroke="#3F8F86" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="210" cy="87" r="4" fill="#E5553B"/>
  </g>
  <!-- An outlined, unfinished source-to-answer connection denotes research. -->
  <g transform="translate(914 89)" stroke="#5A5F9A">
    <rect x="0" y="6" width="93" height="130" rx="5" fill="#FBFAF7" stroke-opacity=".45"/>
    <path d="M18 33H75M18 49H75M18 65H61M18 97H75M18 113H55" stroke-opacity=".5" stroke-width="3"/>
    <path d="M94 71H180" stroke-width="1.5" stroke-dasharray="5 6"/>
    <circle cx="137" cy="71" r="12" fill="#E6E5EF"/>
    <path d="M131 71H143M137 65V77" stroke-width="1.5"/>
    <path d="M185 26H276V116H222L204 132V116H185Z" fill="#FBFAF7" stroke-opacity=".6" stroke-dasharray="5 4"/>
    <path d="M203 49H258M203 65H258M203 81H239" stroke-opacity=".5" stroke-width="3"/>
  </g>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <g font-size="34" font-weight="600" letter-spacing="-1"><text x="46" y="312" fill="#163F52">DataTrust</text><text x="465" y="312" fill="#1F4D47">ConfidenceGuard</text><text x="884" y="312" fill="#2E3160">HallucinationGuard</text></g>
    <g font-size="19"><text x="46" y="345" fill="#163F52">Know the data AI learns from.</text><text x="465" y="345" fill="#1F4D47">Examine the predictions it makes.</text><text x="884" y="345" fill="#2E3160">Explore grounding for its answers.</text></g>
    <g font-family="'Courier New', monospace" font-size="13" letter-spacing="1"><text x="46" y="378" fill="#163F52">DATASET RELIABILITY</text><text x="465" y="378" fill="#1F4D47">PREDICTION RELIABILITY</text><text x="884" y="378" fill="#2E3160">RESEARCH DIRECTION</text></g>
  </g>
</svg>
