interface:
  display_name: "Project Explainer"
  short_description: "Understand and visually map an existing codebase from scratch"
  default_prompt: "Use the project-explainer skill to perform a complete read-only, evidence-grounded teaching walkthrough of this repository. Teach the project from zero, include a domain primer when needed, explicitly separate current implementation state from documented intent, explain the tech stack in context, map major directories and important files, trace multiple real features through actual files and symbols, explain data/state/lifecycle where relevant, and produce distinct architecture/runtime/data diagrams. Prefer completeness over a compressed summary and do not propose future improvements."
policy:
  products:
    - CODEX
  allow_implicit_invocation: false
