<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUMEK — All fifteen composition studies</title><style>
*{box-sizing:border-box}body{margin:0;padding:30px;background:#edf0f1;color:#252b2f;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}h1{font-size:29px;font-weight:500;letter-spacing:-1px;margin:0}p,a{font-size:12px;color:#525c63}a{text-underline-offset:3px}.labels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:12px;color:#616b73;margin-bottom:12px}.row{margin-bottom:25px}h2{font-size:15px;font-weight:600;margin:0 0 10px}.screens{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.screens a{display:block}.screens svg{display:block;width:100%;height:auto;background:white;border:1px solid #dce0e3}@media(max-width:650px){body{padding:18px}.labels{display:none}.screens{grid-template-columns:1fr}header{display:block}h1{font-size:26px}.screens a:before{content:attr(data-label);display:block;font-size:12px;margin:10px 0 6px}}
</style></head><body><header><div><h1>NUMEK / Five complete direction studies</h1><p>Static composition drawings · Local font substitutes · Review checkpoint, before implementation</p></div><a href="index.html">Return to research and proposals</a></header><div class="labels"><span>Landing composition</span><span>Application home</span><span>Analysis results</span></div><main id="studies"></main><script type="module">
const [data,drawings]=await Promise.all([fetch('research/directions.json').then(r=>r.json()),fetch('research/studies.json').then(r=>r.json())]);
for(const d of data){const section=document.createElement('section');section.className='row';const h=document.createElement('h2');h.textContent=d.id+' / '+d.title;const grid=document.createElement('div');grid.className='screens';for(const [id,label] of [['landing','Landing'],['home','Application home'],['results','Analysis results']]){const a=document.createElement('a');a.href=`research/studies/${d.id}-${id}.svg`;a.dataset.label=label;const svg=new DOMParser().parseFromString(drawings[`${d.id}-${id}`],'image/svg+xml').documentElement;svg.setAttribute('role','img');svg.setAttribute('aria-label',`${d.title} — ${label} static study`);a.append(svg);grid.append(a)}section.append(h,grid);document.querySelector('#studies').append(section)}
</script></body></html>
