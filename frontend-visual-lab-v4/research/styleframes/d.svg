e Grotesk, sans-serif" font-size="17" font-weight="500" fill="#21182F">Text</text><text x="869" y="164" font-family="Space Grotesk, sans-serif" font-size="10" font-weight="400" fill="#21182F">Passages &amp; labels</text><rect x="1022" y="110" width="153" height="75" rx="10" fill="#E3D7F0"/><text x="1036" y="141" font-family="Space Grotesk, sans-serif" font-size="17" font-weight="500" fill="#21182F">Image</text><text x="1036" y="164" font-family="Space Grotesk, sans-serif" font-size="10" font-weight="400" fill="#21182F">Assets &amp; metadata</text><rect x="688" y="204" width="490" height="92" rx="9" fill="#21182F"/><text x="706" y="232" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="500" fill="#D9C9F0">Bike Hour</text><text x="706" y="253" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="400" fill="white">Explore a verified target relationship</text><text x="706" y="277" font-family="Space Grotesk, sans-serif" font-size="10" font-weight="400" fill="#8ECFBA">Example dataset / Regression</text><rect x="666" y="336" width="534" height="354" rx="0" fill="#21182F"/><text x="688" y="367" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="500" fill="#D9C9F0">Bike Hour / Evidence trail</text><text x="688" y="405" font-family="Space Grotesk, sans-serif" font-size="10" font-weight="400" fill="#BCAECA">Source fields</text><text x="858" y="405" font-family="Space Grotesk, sans-serif" font-size="10" font-weight="400" fill="#BCAECA">Observed relationship</text><text x="1041" y="405" font-family="Space Grotesk, sans-serif" font-size="10" font-weight="400" fill="#BCAECA">Interpretation</text><rect x="688" y="425" width="145" height="51" rx="6" fill="#382C48"/><text x="702" y="456" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="400" fill="#D9C9F0">casual</text><rect x="688" y="490" width="145" height="51" rx="6" fill="#382C48"/><text x="702" y="521" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="400" fill="#D9C9F0">registered</text><path d="M833 450 H844 V481 H859 M833 515 H844 V481" fill="none" stroke="#8ECFBA" stroke-width="1.5"/><rect x="859" y="448" width="161" height="73" rx="6" fill="#8ECFBA"/><text x="874" y="477" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="500" fill="#21182F">Sum equals cnt</text><text x="874" y="503" font-family="Space Grotesk, sans-serif" font-size="10" font-weight="400" fill="#21182F">17,379 / 17,379 rows</text><path d="M1020,482 L1035,482" fill="none" stroke="#8ECFBA" stroke-width="1.5"/><text x="1041" y="456" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="400" fill="#D9C9F0">Review feature</text><text x="1041" y="478" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="400" fill="#D9C9F0">availability</text><text x="1041" y="500" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="400" fill="#D9C9F0">and derivation.</text><path d="M688,570 L1178,570" fill="none" stroke="#574863" stroke-width="1"/><text x="688" y="598" font-family="Space Grotesk, sans-serif" font-size="13" font-weight="600" fill="#D9C9F0">Why this was surfaced</text><text x="688" y="622" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="400" fill="#E3D7F0">The identity is observed; input timing is supplied by the user.</text><text x="688" y="642" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="400" fill="#E3D7F0">Neither establishes actual model use or leakage.</text><text x="688" y="672" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="400" fill="#8ECFBA">Open source rows</text><text x="1049" y="672" font-family="Space Grotesk, sans-serif" font-size="11" font-weight="400" fill="#8ECFBA">Method &amp; scope</text></svg>