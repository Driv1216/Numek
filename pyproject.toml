[build-system]
requires = ["setuptools>=82,<83", "wheel>=0.47,<0.48"]
build-backend = "setuptools.build_meta"

[project]
name = "datatrust"
version = "0.1.0"
description = "Local-first dataset reliability reports for AI teams."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.0",
  "flask>=3.0",
  "jinja2>=3.0",
  "pandas>=3.0.3,<3.1",
  "numpy>=2.4.6,<2.5",
  "weasyprint>=69,<70",
  "duckdb>=1.5.6,<1.6",
  "psutil>=5.9",
  "tzdata>=2025.2",
  "unicodedataplus==16.0.0.post1",
  "regex==2024.11.6",
]

[project.optional-dependencies]
documents = ["pdfplumber==0.11.9", "python-docx==1.2.0"]
cross-models = ["torch==2.8.0", "transformers==4.57.1", "tokenizers==0.22.1", "safetensors==0.6.2", "sentencepiece==0.2.1", "protobuf==6.33.5"]
images = ["Pillow==12.3.0", "ijson==3.4.0.post0", "PyYAML==6.0.3", "pycocotools==2.0.10"]
image-embeddings = ["torch==2.8.0", "transformers==4.57.1", "tokenizers==0.22.1", "safetensors==0.6.2"]
parquet = ["pyarrow>=19,<26"]
statistics = ["scipy>=1.18.1,<1.19"]
cg4 = ["scipy>=1.18.1,<1.19", "catboost==1.2.10", "pyarrow>=25.0.1,<26", "threadpoolctl==3.6.0"]
cg4-encoders-py314 = ["torch==2.10.0", "transformers==4.57.1", "tokenizers==0.22.1", "safetensors==0.6.2"]
cg6 = ["scikit-learn==1.9.1", "skops==0.16.0", "torch==2.8.0", "safetensors==0.6.2", "onnx==1.23.2", "onnxruntime==1.26.0", "tokenizers==0.22.1", "Pillow==12.3.0", "threadpoolctl==3.6.0", "scipy>=1.18.1,<1.19"]
cg6-cuda = ["scikit-learn==1.9.1", "skops==0.16.0", "torch==2.8.0", "safetensors==0.6.2", "onnx==1.23.2", "onnxruntime-gpu==1.26.0", "tokenizers==0.22.1", "Pillow==12.3.0", "threadpoolctl==3.6.0", "scipy>=1.18.1,<1.19"]
platform = ["psycopg[binary]==3.3.6", "argon2-cffi==25.1.0", "cryptography==50.0.2", "gunicorn==23.0.0", "pyarrow>=25.0.1,<26", "threadpoolctl==3.6.0"]
# CG7 operations service (API, controller, workers): the platform plus the statistics the monitoring and
# investigation templates import. This is what the OCI image installs (constraints/cg7-ops-linux-x86_64-py313.lock).
operations = ["datatrust[platform,statistics]", "scikit-learn==1.9.1"]
text-language = ["lingua-language-detector==2.1.1"]
text-embeddings = ["torch==2.8.0", "transformers==4.57.1", "tokenizers==0.22.1", "safetensors==0.6.2"]
dev = [
  "pypdf>=6,<7",
  "pytest>=7.0",
  "reportlab==4.4.10",
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
]

[project.scripts]
datatrust = "datatrust.cli:main"
confidenceguard = "confidenceguard.cli:main"
numek = "numek_platform.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datatrust = ["templates/*.html", "static/app/*", "static/app/assets/*", "text_search_profile.json", "text_model_artifacts.json", "image_model_artifacts.json", "cross_model_artifacts.json", "legacy_casefold.json"]
confidenceguard = ["templates/*.html", "static/*", "static/ops/*", "static/ops/assets/*", "schemas/*.json"]
numek_platform = ["db/migrations/*.sql"]
