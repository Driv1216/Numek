<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img"><rect width="1100" height="700" fill="#352240"/><text x="38" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFF" letter-spacing="-1">NUMEK</text><text x="410" y="45" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#FFF">DataTrust     Methodology</text><rect x="892" y="22" width="170" height="40" rx="4" fill="#FFF"/><text x="908" y="47" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#14222F">View sample report</text><text x="44" y="175" font-family="Baskerville, Georgia, serif" font-size="80" font-weight="400" fill="#FFFFFF">Make the</text><text x="44" y="258" font-family="Baskerville, Georgia, serif" font-size="80" font-weight="400" fill="#FFFFFF">evidence</text><text x="44" y="341" font-family="Baskerville, Georgia, serif" font-size="80" font-weight="400" fill="#FFFFFF">understood.</text><text x="48" y="466" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#E3DCE7">Dataset reliability, explained.</text><text x="48" y="494" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#E3DCE7">From technical detail to a report</text><text x="48" y="522" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#E3DCE7">you can put in someone’s hands.</text><rect x="47" y="589" width="180" height="40" rx="20" fill="#EDEA93"/><text x="63" y="614" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#352240">Meet DataTrust</text><rect x="600" y="135" width="433" height="545" rx="3" fill="#20112C"/><rect x="574" y="109" width="433" height="545" rx="2" fill="#F7F5FF"/><text x="605" y="147" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#352240">NUMEK</text><text x="841" y="145" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#352240">DataTrust report</text><text x="606" y="214" font-family="Baskerville, Georgia, serif" font-size="43" font-weight="400" fill="#352240">Concrete</text><text x="606" y="260" font-family="Baskerville, Georgia, serif" font-size="43" font-weight="400" fill="#352240">Reliability review</text><path d="M606,287 L975,287" stroke="#D8D0E0" stroke-width="1"/><text x="606" y="316" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#352240">Regression / 1,030 rows / 9 columns</text><rect x="605" y="348" width="370" height="100" rx="0" fill="#EDEA93"/><text x="621" y="376" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#352240">25 rows repeat an earlier record.</text><text x="621" y="405" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#352240">11 exact groups. Review the source context</text><text x="621" y="425" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#352240">before deciding whether repetition is unintended.</text><text x="606" y="482" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#352240">Target distribution</text><path d="M606,593 L971,593" stroke="#D8E4EE" stroke-width="1"/><rect x="606.0" y="586.1130434782609" width="16.210526315789473" height="6.886956521739131" rx="1" fill="#352240"/><rect x="625.2105263157895" y="560.8608695652174" width="16.210526315789473" height="32.13913043478261" rx="1" fill="#352240"/><rect x="644.421052631579" y="542.4956521739131" width="16.210526315789473" height="50.504347826086956" rx="1" fill="#352240"/><rect x="663.6315789473684" y="540.9652173913043" width="16.210526315789473" height="52.03478260869565" rx="1" fill="#352240"/><rect x="682.8421052631579" y="543.2608695652174" width="16.210526315789473" height="49.73913043478261" rx="1" fill="#352240"/><rect x="702.0526315789474" y="514.1826086956522" width="16.210526315789473" height="78.81739130434782" rx="1" fill="#352240"/><rect x="721.2631578947369" y="527.9565217391305" width="16.210526315789473" height="65.04347826086956" rx="1" fill="#352240"