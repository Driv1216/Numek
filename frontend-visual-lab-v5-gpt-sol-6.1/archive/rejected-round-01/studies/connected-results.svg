<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img"><rect width="1100" height="700" fill="#FAF9FD"/><rect x="0" y="0" width="1100" height="68" rx="0" fill="#2A1740"/><text x="27" y="43" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#FFF">DataTrust / Evidence bundle demo</text><text x="785" y="41" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#DDD3EC">Illustrative source content</text><text x="30" y="118" font-family="Arial, sans-serif" font-size="33" font-weight="500" fill="#2A1740">Declared values disagree</text><text x="30" y="151" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740">Record-to-document reconciliation / exact decimal comparison</text><rect x="26" y="185" width="335" height="447" rx="12" fill="#EEEAFB"/><text x="48" y="223" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#2A1740">Source record</text><text x="48" y="271" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740">Entity</text><text x="236" y="271" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740">Example A</text><path d="M48,288 L336,288" stroke="#CBD1D9" stroke-width="1"/><text x="48" y="323" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740">Period</text><text x="236" y="323" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740">2025</text><path d="M48,340 L336,340" stroke="#CBD1D9" stroke-width="1"/><text x="48" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740">Field</text><text x="236" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740">revenue</text><path d="M48,392 L336,392" stroke="#CBD1D9" stroke-width="1"/><text x="48" y="427" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740">Units</text><text x="236" y="427" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740">million</text><path d="M48,444 L336,444" stroke="#CBD1D9" stroke-width="1"/><rect x="43" y="496" width="301" height="89" rx="8" fill="#FFF"/><text x="62" y="528" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1740">Record value</text><text x="62" y="565" font-family="Arial, sans-serif" font-size="35" font-weight="400" fill="#6644D8">12.4</text><rect x="383" y="185" width="430" height="447" rx="8" fill="#FFF" stroke="#DAD1E9"/><text x="409" y="224" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#2A1740">Native document context</text><text x="410" y="280" font-family="Georgia, serif" font-size="25" font-weight="400" fill="#2A1740">Example A / Annual statement</text><rect x="411" y="312" width="337" height="3" rx="0" fill="#E7E1EF"/><rect x="411" y="341" width="350" height="3" rx="0" fill="#E7E1EF"/><rect x="411" y="370" width="298" height="3" rx="0" fill="#E7E1EF"/><rect x="411" y="399" width="339" height="3" rx="0" fill="#E7E1EF"/><rect x="411" y="428" width="310" height="3" rx="0" fill="#E7E1EF"/><rect x="411" y="457" width="348" height="3" rx="0" fill="#E7E1EF"/><rect x="411" y="486" width="265" height="3" rx="0" fill="#E7E1EF"/><rect x="401" y="386" width="365" height="39" rx="2" fill="#FCB3A0"/><text x="413" y="413" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#2A1740">Revenue                     14.2 million</text><text x="410" y="594" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1740">Native text / supplied association</text><text x="839" y="225" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#2A1740">Interpretation</text><text x="839" y="270" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740">Observed discrepancy</text><text x="839" y="296" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740"></text><text x="839" y="322" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740">The declared values differ.</text><text x="839" y="348" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740">Confirm entity, period,</text><text x="839" y="374" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740">units and authority.</text><text x="839" y="400" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740"></text><text x="839" y="426" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740">An observation does not</text><text x="839" y="452" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740">establish which source</text><text x="839" y="478" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#2A1740">is correct.</text><path d="M361,540 C375,540 374,406 400,406" fill="none" stroke="#6644D8" stroke-width="3"/><text x="30" y="674" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1740">Exact evidence stays local. Portable reports omit source content by default.</text></svg>