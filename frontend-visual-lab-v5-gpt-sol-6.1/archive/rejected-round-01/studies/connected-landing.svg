<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img"><rect width="1100" height="700" fill="#EEEAFB"/><text x="38" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#2A1740" letter-spacing="-1">NUMEK</text><text x="410" y="45" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#2A1740">DataTrust     Methodology</text><rect x="892" y="22" width="170" height="40" rx="4" fill="#2A1740"/><text x="908" y="47" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Explore DataTrust</text><text x="40" y="160" font-family="Arial, sans-serif" font-size="55" font-weight="500" fill="#2A1740" letter-spacing="-2">A finding is only as useful</text><text x="40" y="220" font-family="Arial, sans-serif" font-size="55" font-weight="500" fill="#2A1740" letter-spacing="-2">as the evidence behind it.</text><text x="43" y="310" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#2A1740">DataTrust connects the observation to what you can inspect.</text><rect x="42" y="349" width="190" height="40" rx="22" fill="#6644D8"/><text x="58" y="374" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#FFF">Trace an example</text><rect x="42" y="447" width="252" height="188" rx="12" fill="#FFF"/><text x="62" y="478" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#2A1740">Source record</text><text x="62" y="520" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#2A1740">revenue</text><text x="62" y="560" font-family="Arial, sans-serif" font-size="32" font-weight="500" fill="#6644D8">12.4 million</text><text x="62" y="608" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#2A1740">Illustrative evidence bundle</text><path d="M294,540 C380,540 360,457 452,457" fill="none" stroke="#6644D8" stroke-width="3"/><rect x="452" y="415" width="261" height="236" rx="12" fill="#2A1740"/><text x="472" y="448" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#E1D8FA">Declared comparison</text><text x="472" y="494" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#FFF">Values disagree.</text><text x="472" y="528" font-family="Arial, sans-serif" font-size="28" font-weight="500" fill="#FFF">Inspect context.</text><text x="472" y="621" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#E1D8FA">Fact / Candidate / Unresolved</text><path d="M713,535 C790,535 742,486 812,486" fill="none" stroke="#6644D8" stroke-width="3"/><rect x="812" y="375" width="247" height="260" rx="6" fill="#FFF"/><text x="832" y="411" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#2A1740">Native document</text><rect x="833" y="439" width="160" height="3" rx="0" fill="#E6E0EE"/><rect x="833" y="464" width="195" height="3" rx="0" fill="#E6E0EE"/><rect x="833" y="489" width="145" height="3" rx="0" fill="#E6E0EE"/><rect x="833" y="514" width="189" height="3" rx="0" fill="#E6E0EE"/><rect x="833" y="539" width="170" height="3" rx="0" fill="#E6E0EE"/><rect x="828" y="494" width="196" height="36" rx="3" fill="#FCB3A0"/><text x="836" y="518" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#2A1740">Revenue: 14.2 million</text><text x="834" y="607" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#2A1740">Source context retained</text></svg>