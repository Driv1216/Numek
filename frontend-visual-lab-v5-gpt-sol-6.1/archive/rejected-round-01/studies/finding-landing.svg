<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img"><rect width="1100" height="700" fill="#F9FBFD"/><text x="38" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#14222F" letter-spacing="-1">NUMEK</text><text x="410" y="45" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#14222F">DataTrust     Methodology</text><rect x="892" y="22" width="170" height="40" rx="4" fill="#14222F"/><text x="908" y="47" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Explore DataTrust</text><text x="40" y="116" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#14222F">DataTrust / Concrete / A finding, opened</text><text x="35" y="215" font-family="Arial, sans-serif" font-size="89" font-weight="600" fill="#14222F" letter-spacing="-5">25 rows repeat.</text><text x="35" y="305" font-family="Arial, sans-serif" font-size="89" font-weight="600" fill="#14222F" letter-spacing="-5">What comes next?</text><text x="808" y="192" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14222F">Dataset reliability,</text><text x="808" y="221" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14222F">from evidence</text><text x="808" y="250" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14222F">to explanation.</text><rect x="807" y="288" width="220" height="40" rx="4" fill="#E54A2B"/><text x="823" y="313" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#FFF">Inspect this finding</text><rect x="0" y="363" width="1100" height="234" rx="0" fill="#214CD8"/><text x="40" y="403" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#D3DEFF">The observation</text><text x="40" y="452" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#FFF">25 rows repeat an earlier</text><text x="40" y="481" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#FFF">complete parsed record.</text><text x="40" y="510" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#FFF">11 exact groups. 36 participating rows.</text><text x="405" y="403" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#D3DEFF">The evidence</text><text x="405" y="452" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#FFF">Example parsed-row references</text><text x="405" y="481" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#FFF">73 / 78 / 81 / 84 / 87</text><text x="405" y="510" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#FFF">1,030 rows examined.</text><text x="777" y="403" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#D3DEFF">The interpretation</text><text x="777" y="452" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#FFF">Valid repetition or unintended copying?</text><text x="777" y="481" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#FFF">Review source context before</text><text x="777" y="510" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#FFF">deciding whether to remove anything.</text><path d="M378,395 L378,562" stroke="#6C8AF1" stroke-width="1"/><path d="M749,395 L749,562" stroke="#6C8AF1" stroke-width="1"/><text x="40" y="640" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14222F">Understand the data before you train on it.</text><text x="40" y="668" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14222F">Inspectable analysis. Local execution. Reports that explain the evidence.</text></svg>