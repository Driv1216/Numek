<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img"><rect width="1100" height="700" fill="#2923C7"/><text x="38" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFF" letter-spacing="-1">NUMEK</text><text x="410" y="45" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#FFF">DataTrust     Methodology</text><rect x="892" y="22" width="170" height="40" rx="4" fill="#FFF"/><text x="908" y="47" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#14222F">Explore DataTrust</text><text x="38" y="177" font-family="Arial, sans-serif" font-size="64" font-weight="500" fill="#FFF" letter-spacing="-3">Know what your</text><text x="38" y="245" font-family="Arial, sans-serif" font-size="64" font-weight="500" fill="#FFF" letter-spacing="-3">data is telling you.</text><text x="40" y="294" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#E7E4FF">DataTrust brings the evidence into view.</text><text x="40" y="321" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#E7E4FF">Across datasets, representations and reports.</text><rect x="40" y="357" width="220" height="40" rx="20" fill="#F8FAFD"/><text x="56" y="382" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#2923C7">Explore a sample analysis</text><rect x="36" y="440" width="1030" height="216" rx="18" fill="#F8FAFD"/><text x="62" y="479" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#201842">Concrete / Regression evidence</text><rect x="62" y="507" width="250" height="124" rx="9" fill="#DAD6F5"/><text x="79" y="554" font-family="Arial, sans-serif" font-size="30" font-weight="500" fill="#201842">1,030</text><text x="79" y="596" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#201842">finite targets</text><rect x="324" y="507" width="362" height="124" rx="9" fill="#E1E9F5"/><text x="341" y="554" font-family="Arial, sans-serif" font-