<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img"><rect width="1100" height="700" fill="#F9FBFD"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#14222F">DataTrust / Concrete</text><text x="780" y="40" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#14222F">Regression / No composite score</text><text x="30" y="102" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#14222F">Finding</text><path d="M30,119 L315,119" stroke="#CBD1D9" stroke-width="1"/><text x="345" y="102" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#14222F">Supporting evidence</text><path d="M345,119 L735,119" stroke="#CBD1D9" stroke-width="1"/><text x="765" y="102" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#14222F">Interpretation</text><path d="M765,119 L1070,119" stroke="#CBD1D9" stroke-width="1"/><rect x="30" y="142" width="285" height="414" rx="8" fill="#214CD8"/><text x="51" y="184" font-family="Arial, sans-serif" font-size="31" font-weight="600" fill="#FFF">Target variation</text><text x="51" y="219" font-family="Arial, sans-serif" font-size="31" font-weight="600" fill="#FFF">within repeated</text><text x="51" y="254" font-family="Arial, sans-serif" font-size="31" font-weight="600" fill="#FFF">inputs</text><text x="51" y="344" font-family="Arial, sans-serif" font-size="100" font-weight="600" fill="#FFFFFF">9</text><text x="51" y="379" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#FFF">feature-identical groups</text><text x="51" y="513" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#FFF">20 participating rows</text><text x="345" y="169" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#14222F">Target range within one group</text><text x="345" y="212" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#214CD8">22.90–55.90 MPa</text><text x="345" y="268" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#14222F">Group rows</text><text x="635" y="268" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#14222F">107 / 110</text><path d="M345,285 L735,285" stroke="#CBD1D9" stroke-width="1"/><text x="345" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#14222F">Group rows</text><text x="635" y="315" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#14222F">112 / 115</text><path d="M345,332 L735,332" stroke="#CBD1D9" stroke-width="1"/><text x="345" y="362" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#14222F">Distinct targets</text><text x="635" y="362" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#14222F">2</text><path d="M345,379 L735,379" stroke="#CBD1D9" stroke-width="1"/><text x="345" y="409" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#14222F">Inputs</text><text x="635" y="409" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#14222F">Identical</text><path d="M345,426 L735,426" stroke="#CBD1D9" stroke-width="1"/><text x="765" y="176" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#14222F">Variation can reflect repeated</text><text x="765" y="203" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#14222F">measurements, stochastic outcomes,</text><text x="765" y="230" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#14222F">or omitted context.</text><rect x="765" y="290" width="305" height="180" rx="6" fill="#E6EEF8"/><text x="786" y="325" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#14222F">Investigate next</text><text x="786" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#14222F"></text><text x="786" y="375" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#14222F">Review source records and the</text><text x="786" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#14222F">meaning of repeated measurements.</text><text x="786" y="425" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#14222F">Keep legitimate repetition.</text><path d="M30,601 L1070,601" stroke="#CBD1D9" stroke-width="1"/><text x="30" y="637" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#14222F">Coverage and methods</text><text x="345" y="637" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#14222F">Observed evidence / no automatic label correction</text></svg>